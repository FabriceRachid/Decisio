[pytest]
DJANGO_SETTINGS_MODULE = decisiobi.settings
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    -v
    --tb=short

testpaths = 
    apps

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
