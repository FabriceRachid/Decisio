services:
  - type: web
    name: decisio-backend
    runtime: python
    plan: free
    buildCommand: git submodule update --init --recursive && cd decision-spark && npm install && npm run build && cd .. && ENTRY_JS=$(basename $(ls decision-spark/dist/client/assets/index-*.js | head -1)) && printf '<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="utf-8" />\n<meta name="viewport" content="width=device-width, initial-scale=1" />\n<title>DécisioBI</title>\n<link rel="icon" type="image/png" href="/favicon.png" />\n</head>\n<body>\n<div id="root"></div>\n<script type="module" src="/assets/'"$ENTRY_JS"'"></script>\n</body>\n</html>' > decision-spark/dist/client/index.html && mkdir -p backend/frontend && cp -r decision-spark/dist/client/* backend/frontend/ && cd backend && pip install -r requirements.txt && python manage.py migrate && python manage.py install_pgvector && python manage.py collectstatic --noinput && python create_superuser.py
    startCommand: cd backend && gunicorn decisiobi.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "decisio-backend-846m.onrender.com"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: decisio-celery-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A decisiobi worker -l info --concurrency=2
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: decisio-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: decisio-redis
          property: connectionString
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: cron
    name: decisio-celery-beat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A decisiobi beat -l info
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          name: decisio-redis
          property: connectionString

  - type: redis
    name: decisio-redis
    plan: free
    ipAllowList: []
