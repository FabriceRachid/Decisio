services:
  - type: web
    name: decisio-app
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py migrate && python manage.py install_pgvector && python manage.py collectstatic --noinput && python create_superuser.py && cd ../decision-spark && npm install && npm run build
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: NODE_VERSION
        value: "20"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: VITE_API_BASE_URL
        value: ""
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_KPI_MODEL
        value: "openai/gpt-oss-120b"
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false

